# Upstream for Next.js application (production)
upstream avrora_app {
    # PM2 will handle the process
    server 127.0.0.1:4000;
    keepalive 64;
}

# Upstream for WebSocket server (port 3001)
upstream avrora_ws {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;  # Increased from 5r/m to 30r/m for NextAuth
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name avrora.click;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avrora.click;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/avrora.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avrora.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/avrora.click/chain.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP header - adjust based on your needs
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' wss: https:; media-src 'self' https:; frame-ancestors 'self';" always;

    # Client body size for file uploads
    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # Timeouts for long-running operations and streaming
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Buffer settings for better performance
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-js text/x-cross-domain-policy application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject font/opentype font/ttf font/eot font/otf;
    gzip_disable "msie6";
    gzip_comp_level 6;

    # Access and error logs
    access_log /var/log/nginx/avrora.access.log combined;
    error_log /var/log/nginx/avrora.error.log error;

    # Static files from Next.js build
    location /_next/static/ {
        alias /home/adiom/avrora-area/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files
    location /static/ {
        alias /home/adiom/avrora-area/public/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        alias /home/adiom/avrora-area/public/favicon.ico;
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        alias /home/adiom/avrora-area/public/robots.txt;
        expires 30d;
        access_log off;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Authentication endpoints - moderate rate limiting for NextAuth
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://avrora_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints - moderate rate limiting
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://avrora_app;
        proxy_http_version 1.1;
        # Extended timeouts for streaming endpoints
        proxy_connect_timeout 90s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # Disable buffering for SSE/streaming responses
        proxy_buffering off;
        proxy_cache off;
        # Headers for proper proxy behavior
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE support
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        # Keep connection alive
        proxy_set_header Connection "keep-alive";
        # Prevent proxy from closing connection
        proxy_ignore_client_abort on;
    }

    # Chat API with special handling for streaming
    location ~ ^/api/v1/chat {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://avrora_app;
        proxy_http_version 1.1;
        # Extended timeouts for chat streaming
        proxy_connect_timeout 90s;
        proxy_send_timeout 3600s; # 1 hour for long conversations
        proxy_read_timeout 3600s;
        # Completely disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # SSE/streaming headers
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        proxy_set_header Connection "keep-alive";
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for potential upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Prevent nginx from closing prematurely
        proxy_ignore_client_abort on;
        # Chunk transfer encoding
        chunked_transfer_encoding on;
    }

    # WebSocket support for any WS endpoints
    location /ws {
        proxy_pass http://avrora_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Default location - Next.js application
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://avrora_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "keep-alive";
        proxy_cache_bypass $http_upgrade;
        # Next.js specific
        proxy_set_header X-Forwarded-Server $host;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup and config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Optional: Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.avrora.click;

    ssl_certificate /etc/letsencrypt/live/avrora.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avrora.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://avrora.click$request_uri;
}





