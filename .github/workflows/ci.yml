name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-not-used-in-any-real-environment
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      # next build only — `pnpm build` also runs DB migrations, which needs a live Postgres
      - run: pnpm exec next build
